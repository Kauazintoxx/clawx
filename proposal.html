<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proposta — Offbeat</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/base.css" />
<style>
  body { background: var(--ink); color: var(--paper); min-height: 100svh; }
  .pp { max-width: 820px; margin: 0 auto; padding: clamp(32px, 8vh, 90px) var(--gutter) 120px; }
  .pp .mono { color: var(--muted); }
  .pp header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line-inv); padding-bottom: 18px; margin-bottom: 40px; }
  .pp header .serif { font-size: 1.8rem; } .pp header .serif i { color: var(--safelight); font-style: normal; }
  .pp h1 { font: 400 clamp(2.6rem, 8vw, 5.6rem)/.92 var(--f-display); letter-spacing: -.02em; margin: .1em 0 .3em; }
  .pp .msg { font: italic 400 clamp(1.3rem, 2.6vw, 1.8rem)/1.3 var(--f-display); color: rgba(239,234,224,.85); margin: 0 0 40px; max-width: 36ch; }
  .items { border-top: 1px solid var(--line-inv); }
  .items div { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line-inv); font-size: 1.05rem; }
  .items .tot { font: 400 2.2rem var(--f-display); border-bottom: 0; }
  .items .disc { color: #6fd08c; }
  .meta { display: flex; flex-wrap: wrap; gap: 24px; margin: 24px 0 40px; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .acts .btn--ghost { --fg: var(--paper); }
  .done { padding: 28px; border-radius: 18px; background: rgba(239,234,224,.06); box-shadow: inset 0 0 0 1px var(--line-inv); }
  .done h2 { font: 400 2.4rem/1 var(--f-display); margin: 0 0 8px; }
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); }
  .modal[hidden] { display: none; }
  .modal form { width: min(460px, 100%); display: grid; gap: 12px; padding: 28px; border-radius: 18px; background: var(--paper); color: var(--ink); }
  .modal h2 { font: 400 2.2rem/1 var(--f-display); margin: 0; }
  .modal input, .modal textarea { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 1rem; }
  .modal .btn { justify-content: center; }
</style>
</head>
<body>
<main class="pp" id="pp"><p class="mono">Carregando…</p></main>
<div class="modal" id="modal" hidden><form id="mf"></form></div>
<script src="assets/js/store.js"></script>
<script>
(function () {
  const O = Offbeat, $ = (s) => document.querySelector(s), id = location.hash.slice(1);
  const total = (p) => Math.max(0, p.items.reduce((a, it) => a + it.qty * it.price, 0) - (p.discount || 0));
  const p0 = O.get().proposals.find((x) => x.id === id);
  if (p0 && !sessionStorage.getItem("ob-pv-" + id)) {
    sessionStorage.setItem("ob-pv-" + id, "1");
    O.update((s) => { const p = s.proposals.find((x) => x.id === id); p.views = (p.views || 0) + 1; if (!p.viewedAt) p.viewedAt = Date.now(); if (p.status === "enviada") p.status = "vista"; const l = s.leads.find((x) => x.id === p.leadId); O.log(`${l ? l.name.split(" ")[0] : "Cliente"} abriu a proposta “${p.title}”`, "view"); });
  }
  function render() {
    const s = O.get(), p = s.proposals.find((x) => x.id === id), st = s.studio;
    const box = $("#pp");
    if (!p) { box.innerHTML = `<p class="mono">${O.esc(st.brand)}</p><h1>Proposta não encontrada.</h1>`; return; }
    const l = s.leads.find((x) => x.id === p.leadId), expired = p.validUntil < Date.now() && !["aceita", "recusada"].includes(p.status);
    document.title = `${p.title} — ${st.brand}`;
    box.innerHTML = `<header><span class="serif">${O.esc(st.brand)}<i>.</i></span><span class="mono">Proposta · ${O.esc(st.name)}</span></header>
      <p class="mono">${l ? `Para ${O.esc(l.name)}` : ""}</p><h1>${O.esc(p.title)}</h1><p class="msg">${O.esc(p.message)}</p>
      <div class="items">${p.items.map((it) => `<div><span>${O.esc(it.desc)}${it.qty > 1 ? ` <span class="mono">× ${it.qty}</span>` : ""}</span><span>${O.money(it.qty * it.price)}</span></div>`).join("")}
        ${p.discount ? `<div class="disc"><span>Desconto</span><span>− ${O.money(p.discount)}</span></div>` : ""}<div class="tot"><span>Total</span><span>${O.money(total(p))}</span></div></div>
      <div class="meta mono"><span>Válida até ${O.date(p.validUntil, { day: "2-digit", month: "long", year: "numeric" })}</span><span>Sinal de 30% via Pix para reservar a data</span></div>
      ${p.status === "aceita" ? `<div class="done"><h2>Proposta aceita ✓</h2><p>Aceita por ${O.esc(p.acceptedBy || l?.name || "")} em ${O.date(p.respondedAt, { day: "2-digit", month: "long", hour: "2-digit", minute: "2-digit" })}. ${O.esc(st.name)} vai enviar o contrato e o link do sinal.</p></div>`
        : p.status === "recusada" ? `<div class="done"><h2>Proposta recusada</h2><p>Obrigado pelo retorno. Se quiser conversar sobre outra opção, é só chamar.</p></div>`
        : expired ? `<div class="done"><h2>Proposta vencida</h2><p>Fale com ${O.esc(st.name)} para atualizar os valores e a data.</p></div>`
        : `<div class="acts"><button class="btn btn--red" id="ok">Aceitar proposta →</button><button class="btn btn--ghost" id="no">Recusar</button><a class="btn btn--ghost" target="_blank" rel="noopener" href="https://wa.me/${st.whatsapp}?text=${encodeURIComponent(`Oi ${st.name}! Tenho uma dúvida sobre a proposta “${p.title}”.`)}">Tirar dúvida no WhatsApp</a></div>`}`;
    $("#ok")?.addEventListener("click", () => ask("ok", l));
    $("#no")?.addEventListener("click", () => ask("no", l));
  }
  function ask(kind, l) {
    const m = $("#modal"), f = $("#mf");
    f.innerHTML = kind === "ok"
      ? `<h2>Aceitar proposta</h2><label>Seu nome completo<br><input name="name" required value="${O.esc(l?.name || "")}" style="width:100%"></label><button class="btn btn--red">Confirmar aceite</button><button type="button" class="btn btn--ghost" id="mc">Voltar</button>`
      : `<h2>Recusar proposta</h2><label>Pode contar o motivo? (opcional)<br><textarea name="reason" rows="3" style="width:100%"></textarea></label><button class="btn btn--red">Recusar</button><button type="button" class="btn btn--ghost" id="mc">Voltar</button>`;
    m.hidden = false; $("#mc").onclick = () => (m.hidden = true);
    f.onsubmit = (e) => {
      e.preventDefault(); const x = Object.fromEntries(new FormData(f));
      O.update((s) => {
        const p = s.proposals.find((y) => y.id === id), L = s.leads.find((y) => y.id === p.leadId);
        p.respondedAt = Date.now();
        if (kind === "ok") { p.status = "aceita"; p.acceptedBy = x.name; if (L && ["lead", "orcamento", "negociacao"].includes(L.stage)) { L.stage = "contrato"; L.value = total(p); } O.log(`${x.name} aceitou a proposta “${p.title}” (${O.money(total(p))})`, "pay"); }
        else { p.status = "recusada"; p.reason = x.reason; O.log(`Proposta “${p.title}” recusada${x.reason ? `: ${x.reason}` : ""}`, "warn"); }
      });
      m.hidden = true;
    };
  }
  render(); O.onChange(render);
})();
</script>
</body>
</html>
