<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel — Offbeat</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0f0e0c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
<!-- Entrada do estúdio (senha do dono) -->
<section class="lock" id="lock" hidden>
  <svg class="lock__iris" viewBox="-100 -100 200 200" aria-hidden="true"><g id="lockBlades"></g><circle r="98" fill="none" stroke="currentColor" stroke-opacity=".25" /></svg>
  <form class="lock__box" id="lockForm" autocomplete="off">
    <p class="mono">Estúdio Offbeat</p>
    <h1 class="serif" id="lockTitle">Olá, Lázaro.</h1>
    <p class="lock__sub" id="lockSub">Digite sua senha para entrar no estúdio.</p>
    <label class="lock__field"><span class="mono">Senha</span><input type="password" id="lockPw" required minlength="4" autocomplete="current-password" /></label>
    <label class="lock__field" id="lockConfirmWrap" hidden><span class="mono">Repita a senha</span><input type="password" id="lockPw2" minlength="4" autocomplete="new-password" /></label>
    <p class="lock__err mono" id="lockErr" role="alert"></p>
    <button class="btn btn--red" type="submit" id="lockBtn">Entrar <span class="arr">→</span></button>
    <a class="lock__back mono" href="index.html">← Voltar ao início</a>
  </form>
</section>

<div class="app" id="app">
  <header class="mtop">
    <button id="menuBtn" aria-label="Abrir menu">☰</button>
    <a class="logo" href="#/">Offbeat</a>
    <button id="cmdBtnM" aria-label="Buscar">⌘</button>
  </header>

  <aside class="side" id="side">
    <a class="logo" href="index.html">Offbeat<i></i><small>ESTÚDIO</small></a>
    <nav id="nav" aria-label="Painel">
      <a href="#/" data-r="overview"><span class="mono">01</span>Visão geral</a>
      <a href="#/projetos" data-r="projetos"><span class="mono">02</span>Projetos</a>
      <a href="#/galerias" data-r="galerias"><span class="mono">03</span>Galerias <b id="navSel" hidden></b></a>
      <a href="#/crm" data-r="crm"><span class="mono">04</span>Clientes · CRM</a>
      <a href="#/propostas" data-r="propostas"><span class="mono">05</span>Propostas</a>
      <a href="#/tarefas" data-r="tarefas"><span class="mono">06</span>Tarefas <b id="navTask" hidden></b></a>
      <a href="#/agenda" data-r="agenda"><span class="mono">07</span>Agenda</a>
      <a href="#/financeiro" data-r="financeiro"><span class="mono">08</span>Financeiro <b id="navPay" hidden></b></a>
      <a href="#/albuns" data-r="albuns"><span class="mono">09</span>Álbuns</a>
      <a href="#/ar" data-r="ar"><span class="mono">10</span>Realidade aumentada</a>
      <a href="#/site" data-r="site"><span class="mono">11</span>Meu site</a>
      <div class="side__sep"></div>
      <a href="#/ajustes" data-r="ajustes"><span class="mono">⚙</span>Ajustes</a>
    </nav>
    <div class="side__foot">
      <span class="live">AO VIVO</span>
      <button class="side__kbd" id="cmdBtn"><span>Buscar ou criar…</span><kbd>Ctrl K</kbd></button>
      <div class="side__me"><span class="av">L</span><span><strong id="meName">Lázaro</strong><br /><small class="mono" style="color:rgba(239,234,224,.5)">Fotógrafo</small></span><button id="themeBtn" aria-label="Alternar tema" title="Tema claro/escuro">◐</button><button id="logoutBtn" aria-label="Sair" title="Sair do estúdio">⏻</button></div>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="cmdk" id="cmdk" hidden><div class="cmdk__box"><input id="cmdIn" placeholder="Ir para, criar galeria, novo cliente, cobrança…" autocomplete="off" /><ul id="cmdList" role="listbox"></ul></div></div>
<div id="print"></div>

<script src="assets/vendor/qrcode.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/pix.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/zip.js"></script>
<script src="assets/js/blocks.js"></script>
<script src="assets/js/app-work.js"></script>
<script src="assets/js/app-finance.js"></script>
<script src="assets/js/app-site.js"></script>
<script src="assets/js/app-ar.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
