<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel — Offbeat</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0f0e0c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
<!-- Entrada do estúdio (senha do dono) -->
<section class="lock" id="lock" hidden>
  <svg class="lock__iris" viewBox="-100 -100 200 200" aria-hidden="true"><g id="lockBlades"></g><circle r="98" fill="none" stroke="currentColor" stroke-opacity=".25" /></svg>
  <form class="lock__box" id="lockForm" autocomplete="off">
    <p class="mono">Estúdio Offbeat</p>
    <h1 class="serif" id="lockTitle">Olá, Lázaro.</h1>
    <p class="lock__sub" id="lockSub">Digite sua senha para entrar no estúdio.</p>
    <label class="lock__field"><span class="mono">Senha</span><input type="password" id="lockPw" required minlength="4" autocomplete="current-password" /></label>
    <label class="lock__field" id="lockConfirmWrap" hidden><span class="mono">Repita a senha</span><input type="password" id="lockPw2" minlength="4" autocomplete="new-password" /></label>
    <p class="lock__err mono" id="lockErr" role="alert"></p>
    <button class="btn btn--red" type="submit" id="lockBtn">Entrar <span class="arr">→</span></button>
    <a class="lock__back mono" href="index.html">← Voltar ao início</a>
  </form>
</section>

<div class="app" id="app">
  <header class="topbar" id="topbar">
    <a class="logo" href="#/" aria-label="Início">Offbeat<i></i></a>
    <nav class="crumbs" aria-label="Você está em"><a href="#/" id="homeLink">Início</a><span id="crumb" hidden></span></nav>
    <div class="topbar__r">
      <span class="live">AO VIVO</span>
      <button class="tb-search" id="cmdBtn" aria-label="Buscar ou criar"><span>⌕ Buscar ou criar…</span><kbd>Ctrl K</kbd></button>
      <a class="tb-alert" id="alertBtn" href="#/oportunidades" title="Oportunidades com prioridade alta" hidden><span>●</span><b id="alertN">0</b></a>
      <button class="tb-ic" id="themeBtn" aria-label="Alternar tema" title="Tema claro/escuro">◐</button>
      <span class="av" title="Lázaro"><span id="meName" hidden>Lázaro</span>L</span>
      <button class="tb-ic" id="logoutBtn" aria-label="Sair" title="Sair do estúdio">⏻</button>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="cmdk" id="cmdk" hidden><div class="cmdk__box"><input id="cmdIn" placeholder="Ir para, criar galeria, novo cliente, cobrança…" autocomplete="off" /><ul id="cmdList" role="listbox"></ul></div></div>
<div id="print"></div>

<script src="assets/vendor/qrcode.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/pix.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/zip.js"></script>
<script src="assets/js/blocks.js"></script>
<script src="assets/js/insights.js"></script>
<script src="assets/js/app-work.js"></script>
<script src="assets/js/app-finance.js"></script>
<script src="assets/js/app-site.js"></script>
<script src="assets/js/app-ar.js"></script>
<script src="assets/js/app-growth.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
