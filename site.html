<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lázaro — Fotografia</title>
<meta name="description" content="Portfólio de Lázaro, fotógrafo. Casamentos, ensaios e eventos." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/public.css" />
</head>
<body class="pf" id="pf">
<header class="pf-top"><a class="serif" id="pfName" href="site.html">Lázaro</a><nav id="pfNav"></nav></header>
<section class="pf-hero"><p class="mono" id="pfKicker">Fotógrafo · São Paulo</p><h1 id="pfHead"></h1></section>
<section class="pf-sec" id="trabalhos"><h2>Trabalhos</h2><div id="pfSets"></div></section>
<section class="pf-sec pf-about" id="sobre"><h2>Sobre</h2><p id="pfAbout"></p></section>
<section class="pf-sec pf-test" id="depo"><h2>Quem viveu</h2><div class="q" id="pfTest"></div></section>
<section class="pf-sec" id="blog"><h2>Diário</h2><div class="pf-posts" id="pfPosts"></div></section>
<section class="pf-sec pf-contact" id="contato"><div><h2>Vamos conversar?</h2><p class="mono" style="text-transform:none" id="pfContactTxt"></p><p><a class="btn btn--red" id="pfWa" target="_blank" rel="noopener">Chamar no WhatsApp</a></p></div>
  <div class="bk-form" id="pfForm"></div></section>
<footer class="pf-foot"><span class="mono" id="pfFoot"></span><a href="index.html" class="mono">Estúdio Offbeat</a></footer>
<script src="assets/js/store.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/blocks.js"></script>
<script>
(function () {
  const O = Offbeat, B = Blocks, $ = (s) => document.querySelector(s);
  B.css();
  $("#pfForm").innerHTML = B.render({ type: "form", title: "" }).replace(/<h2><\/h2>/, "");
  B.mountForms($("#pfForm"), "Site");
  function render() {
    const s = O.get(), st = s.site, me = s.studio;
    const pf = $("#pf");
    pf.dataset.theme = st.theme; pf.style.setProperty("--acc", st.accent);
    B.seo({ title: st.seo.title || `${me.name} — Fotografia`, description: st.seo.description, image: st.seo.image, jsonld: B.studioLD(s) });
    $("#pfName").textContent = me.name;
    const words = st.headline.trim().split(" "), last = words.pop();
    $("#pfHead").innerHTML = `${O.esc(words.join(" "))} <em>${O.esc(last)}</em>`;
    $("#pfAbout").textContent = st.about;
    const posts = s.posts.filter((p) => p.published).sort((a, b) => b.date - a.date);
    const pages = s.pages.filter((p) => p.published);
    $("#sobre").hidden = !st.sections.about; $("#depo").hidden = !st.sections.testimonials; $("#contato").hidden = !st.sections.contact;
    $("#blog").hidden = !st.blog || !posts.length;
    $("#pfNav").innerHTML = [["#trabalhos", "Trabalhos"], st.sections.about && ["#sobre", "Sobre"], st.blog && posts.length && ["#blog", "Diário"],
      ...pages.map((p) => [O.pageLink(p), p.title]), st.sections.contact && ["#contato", "Contato"]].filter(Boolean).map(([h, n]) => `<a href="${O.esc(h)}">${O.esc(n)}</a>`).join("");
    $("#pfTest").innerHTML = st.testimonials.map((t) => `<blockquote>“${O.esc(t.text)}”<cite>${O.esc(t.author)}${t.role ? " · " + O.esc(t.role) : ""}</cite></blockquote>`).join("");
    $("#pfPosts").innerHTML = posts.slice(0, 6).map((p) => `<a class="pf-post" href="${O.esc(O.postLink(p))}"><div class="cv"><img data-bg="${O.esc(p.cover?.gid || "")}" data-bp="${O.esc(p.cover?.pid || "")}" data-bw="800" alt=""></div><span class="mono">${O.date(p.date, { day: "2-digit", month: "long", year: "numeric" })}</span><h3>${O.esc(p.title)}</h3><p>${O.esc(p.excerpt)}</p></a>`).join("");
    $("#pfWa").href = `https://wa.me/${me.whatsapp}?text=${encodeURIComponent("Oi " + me.name + "! Vi seu site e queria um orçamento.")}`;
    $("#pfContactTxt").textContent = `${me.email} · ${me.instagram}`;
    $("#pfFoot").textContent = `© ${new Date().getFullYear()} ${me.name} · ${me.brand}`;
    const sets = s.galleries.filter((g) => st.galleryIds.includes(g.id));
    $("#pfSets").innerHTML = sets.map((g) => `<article class="pf-set"><header><h3>${O.esc(g.title)}</h3><span class="mono">${O.esc(g.subtitle || "")}</span></header>
      <div class="pf-grid">${g.photos.filter((p) => !p.video).slice(0, 6).map((p) => `<figure data-reveal><img data-bg="${g.id}" data-bp="${p.id}" data-bw="1000" alt="${O.esc(g.title)}" loading="lazy"></figure>`).join("")}</div></article>`).join("") || '<p class="mono">Escolha galerias no painel para aparecerem aqui.</p>';
    B.hydrate(document);
    Motion.reveal();
  }
  render();
  O.onChange(render);
  document.addEventListener("contextmenu", (e) => { if (e.target.tagName === "IMG") e.preventDefault(); });
})();
</script>
</body>
</html>
